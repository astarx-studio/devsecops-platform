# OIDC ForwardAuth middlewares (Traefik file provider).
# oidc-auth → oauth2-proxy:4180 (operator UIs, default groups admins).
# oidc-auth-apps → oauth2-proxy-apps:4181 /oauth2/auth (optional; app-zone reverse-proxy is primary).
# oidc-auth-devtools → oauth2-proxy-devtools:4182 (shared DevTools UIs e.g. Grafana; admins+users).
# ForwardAuth targets proxy root so unauthenticated users get 302 to Keycloak.
# ForwardAuth-only proxies use OAUTH2_PROXY_UPSTREAMS=static://202 (allow → 202).
http:
  middlewares:
    oidc-auth:
      forwardAuth:
        address: "http://oauth2-proxy:4180/"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Auth-Request-User"
          - "X-Auth-Request-Email"
          - "X-Auth-Request-Access-Token"
    oidc-auth-apps:
      forwardAuth:
        address: "http://oauth2-proxy-apps:4181/oauth2/auth"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Auth-Request-User"
          - "X-Auth-Request-Email"
          - "X-Auth-Request-Access-Token"
    oidc-auth-devtools:
      forwardAuth:
        address: "http://oauth2-proxy-devtools:4182/"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Auth-Request-User"
          - "X-Auth-Request-Email"
          - "X-Auth-Request-Access-Token"
