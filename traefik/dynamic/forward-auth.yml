# OIDC ForwardAuth middlewares (Traefik file provider).
# oidc-auth → oauth2-proxy:4180 (operator UIs, default groups admins).
# oidc-auth-apps → oauth2-proxy-apps:4181 (dev/stg app zones, default groups admins+users).
# ForwardAuth targets oauth2-proxy root so unauthenticated users get 302 to Keycloak.
# oauth2-proxy uses OAUTH2_PROXY_UPSTREAMS=static://202 for ForwardAuth allow (202).
http:
  middlewares:
    oidc-auth:
      forwardAuth:
        address: "http://oauth2-proxy:4180/"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Auth-Request-User"
          - "X-Auth-Request-Email"
          - "X-Auth-Request-Access-Token"
    oidc-auth-apps:
      forwardAuth:
        address: "http://oauth2-proxy-apps:4181/oauth2/auth"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Auth-Request-User"
          - "X-Auth-Request-Email"
          - "X-Auth-Request-Access-Token"
