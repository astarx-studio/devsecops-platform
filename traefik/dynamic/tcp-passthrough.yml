# =============================================================================
# Traefik Dynamic Configuration — TCP Passthrough
# =============================================================================
# Non-HTTP services exposed directly to developers' machines. SSO gating is
# meaningless for raw TCP protocols (Postgres wire protocol, AMQP) — auth is
# handled by the service itself (DB user/password, RabbitMQ credentials).
#
# Both backends are plain Docker containers on devops-network
# (devtools/docker-compose.yml), reachable by container name — no k3d
# NodePort indirection. Env isolation for RabbitMQ is via vhosts (dev/stg),
# not separate host ports.
# =============================================================================

tcp:
  routers:
    devtools-pg:
      rule: "HostSNI(`*`)"
      entryPoints:
        - devtools-pg
      service: devtools-pg

    devtools-amqp:
      rule: "HostSNI(`*`)"
      entryPoints:
        - devtools-amqp
      service: devtools-amqp

    devtools-amqp-mgmt:
      rule: "HostSNI(`*`)"
      entryPoints:
        - devtools-amqp-mgmt
      service: devtools-amqp-mgmt

    devtools-minio-s3:
      rule: "HostSNI(`*`)"
      entryPoints:
        - devtools-minio-s3
      service: devtools-minio-s3

  services:
    devtools-pg:
      loadBalancer:
        servers:
          - address: "devtools-postgres:5432"

    devtools-amqp:
      loadBalancer:
        servers:
          - address: "devtools-rabbitmq:5672"

    # Management UI is HTTP on :15672; still TCP-passthrough (no TLS / SSO).
    devtools-amqp-mgmt:
      loadBalancer:
        servers:
          - address: "devtools-rabbitmq:15672"

    devtools-minio-s3:
      loadBalancer:
        servers:
          - address: "devtools-minio:9000"
