# =============================================================================
# Traefik Dynamic Configuration — TCP Passthrough
# =============================================================================
# Non-HTTP services exposed directly to developers' machines. SSO gating is
# meaningless for raw TCP protocols (Postgres wire protocol, AMQP) — auth is
# handled by the service itself (DB user/password, RabbitMQ credentials).
#
# Shared DevTools backends are Docker containers on devops-network
# (devtools/docker-compose.yml), reachable by container name. CFA AMQP uses
# k3d NodePorts on k3d-dsoaas-server-0 (must match RABBITMQ_NODE_PORT in
# cfa/infra .gitlab-ci.yml: 30572=dev, 30573=stg).
# =============================================================================

tcp:
  routers:
    devtools-pg:
      rule: "HostSNI(`*`)"
      entryPoints:
        - devtools-pg
      service: devtools-pg

    devtools-amqp:
      rule: "HostSNI(`*`)"
      entryPoints:
        - devtools-amqp
      service: devtools-amqp

    devtools-amqp-mgmt:
      rule: "HostSNI(`*`)"
      entryPoints:
        - devtools-amqp-mgmt
      service: devtools-amqp-mgmt

    cfa-amqp-dev:
      rule: "HostSNI(`*`)"
      entryPoints:
        - cfa-amqp-dev
      service: cfa-amqp-dev

    cfa-amqp-stg:
      rule: "HostSNI(`*`)"
      entryPoints:
        - cfa-amqp-stg
      service: cfa-amqp-stg

    devtools-minio-s3:
      rule: "HostSNI(`*`)"
      entryPoints:
        - devtools-minio-s3
      service: devtools-minio-s3

  services:
    devtools-pg:
      loadBalancer:
        servers:
          - address: "devtools-postgres:5432"

    devtools-amqp:
      loadBalancer:
        servers:
          - address: "devtools-rabbitmq:5672"

    # Management UI is HTTP on :15672; still TCP-passthrough (no TLS / SSO).
    devtools-amqp-mgmt:
      loadBalancer:
        servers:
          - address: "devtools-rabbitmq:15672"

    # CFA in-cluster RabbitMQ (helm exposeNodePort) via k3d server NodePort.
    cfa-amqp-dev:
      loadBalancer:
        servers:
          - address: "k3d-dsoaas-server-0:30572"

    cfa-amqp-stg:
      loadBalancer:
        servers:
          - address: "k3d-dsoaas-server-0:30573"

    devtools-minio-s3:
      loadBalancer:
        servers:
          - address: "devtools-minio:9000"
