# =============================================================================
# devtools k8s bridge
#
# devtools-postgres, devtools-rabbitmq, and devtools-minio run as plain Docker containers
# (devtools/docker-compose.yml), not as k8s workloads. Pods can't reliably
# resolve a Docker container name across the node/pod network-namespace
# boundary, so this Namespace + selector-less Services + manual Endpoints
# bridge fixed IPs on devops-network into normal in-cluster DNS.
#
# After applying, any pod in any namespace (dev, stg, prod) can reach:
#   devtools-postgres.devtools.svc.cluster.local:5432
#   devtools-rabbitmq.devtools.svc.cluster.local:5672   (AMQP)
#   devtools-rabbitmq.devtools.svc.cluster.local:15672  (Management UI)
#   devtools-minio.devtools.svc.cluster.local:9000      (S3 API)
#
# RabbitMQ env isolation is by vhost (dev / stg), not by host.
#
# Apply with: ./devtools/apply-k8s-bridge.sh
# (idempotent; not part of the mandatory `make bootstrap` chain — devtools is
# opt-in and applied manually once both the devtools compose stack and the
# k3d cluster are up)
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: devtools
---
apiVersion: v1
kind: Service
metadata:
  name: devtools-postgres
  namespace: devtools
spec:
  ports:
    - name: pg
      port: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: devtools-postgres
  namespace: devtools
subsets:
  - addresses:
      # Must match DEVTOOLS_PG_STATIC_IP in devtools/.env.
      - ip: 172.19.0.100
    ports:
      - name: pg
        port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: devtools-rabbitmq
  namespace: devtools
spec:
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
---
apiVersion: v1
kind: Endpoints
metadata:
  name: devtools-rabbitmq
  namespace: devtools
subsets:
  - addresses:
      # Must match DEVTOOLS_RMQ_STATIC_IP in devtools/.env.
      - ip: 172.19.0.101
    ports:
      - name: amqp
        port: 5672
      - name: management
        port: 15672

---
apiVersion: v1
kind: Service
metadata:
  name: devtools-loki
  namespace: devtools
spec:
  ports:
    - name: http
      port: 3100
---
apiVersion: v1
kind: Endpoints
metadata:
  name: devtools-loki
  namespace: devtools
subsets:
  - addresses:
      # Must match DEVTOOLS_LOKI_STATIC_IP in devtools/.env.
      - ip: 172.19.0.102
    ports:
      - name: http
        port: 3100

---
apiVersion: v1
kind: Service
metadata:
  name: devtools-minio
  namespace: devtools
spec:
  ports:
    - name: s3
      port: 9000
    - name: console
      port: 9001
---
apiVersion: v1
kind: Endpoints
metadata:
  name: devtools-minio
  namespace: devtools
subsets:
  - addresses:
      # Must match DEVTOOLS_MINIO_STATIC_IP in devtools/.env.
      - ip: 172.19.0.103
    ports:
      - name: s3
        port: 9000
      - name: console
        port: 9001
