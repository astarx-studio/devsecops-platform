# =============================================================================
# devtools stack — shared Postgres + MySQL + RabbitMQ + MinIO + logging
# (Loki/Grafana/Alloy) for app teams on this host.
#
# Independent Compose project (deliberately separate from the main platform
# stack). Run from the devsecops-platform repo root:
#
#   docker compose -p devtools -f devtools/docker-compose.yml up -d
#   docker compose -p devtools -f devtools/docker-compose.yml down
#
# Joins the *existing* devops-network created by the main stack (external),
# so it's reachable by container name from Traefik and from the k3d server
# node — see devtools/k8s-bridge.yaml for how pods reach it.
#
# Env isolation (generic):
#   Postgres  → logical DBs created by project-specific scripts in
#               postgres-init/ (gitignored; copy from *.sample.sh)
#   RabbitMQ  → vhosts dev / stg  (created by rabbitmq-init/ensure-vhosts.sh)
#   MySQL     → users admin (ALL) + esa_dev (esa_dev.*); DBs via mysql-init
#   MinIO     → users admin (root) + cfa (readwrite); buckets cfa-dev / cfa-stg
#   Logging   → Loki labels (namespace / app / container); Grafana UI via
#               https://${GRAFANA_DOMAIN} + oidc-auth-devtools (admins+users)
#
# k3d pod logs: apply devtools/k8s/alloy-daemonset.yaml after the bridge.
# =============================================================================

networks:
  devops-network:
    external: true
    name: ${DOCKER_NETWORK:-devops-network}

services:
  # DNS: devtools-postgres (service/container name). Fixed static IP so the
  # k8s bridge Service/Endpoints (k8s-bridge.yaml) has a stable target.
  devtools-postgres:
    image: postgres:16-alpine
    container_name: devtools-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEVTOOLS_PG_DB:-devtools}
      POSTGRES_USER: ${DEVTOOLS_PG_USER:?set DEVTOOLS_PG_USER in devtools/.env}
      # Qestor Vault profiles runtime-dev, runtime-stg, and runtime-prod copy this
      # password into DATABASE_URL and HASURA_GRAPHQL_DATABASE_URL. After changing
      # DEVTOOLS_PG_PASSWORD, update those profiles and restart qestor-core-core
      # and qestor-core-hasura. A mismatch takes down sign-in and GraphQL while
      # the API health check still looks fine.
      POSTGRES_PASSWORD: ${DEVTOOLS_PG_PASSWORD:?set DEVTOOLS_PG_PASSWORD in devtools/.env}
    # Reclaim leaked GUI/JDBC idle sessions (Navicat via Traefik :25432 is the usual
    # offender). Pools reconnect; apps should set pool maxIdleTime <= this timeout.
    command:
      - postgres
      - -c
      - idle_session_timeout=${DEVTOOLS_PG_IDLE_SESSION_TIMEOUT:-10min}
      - -c
      - idle_in_transaction_session_timeout=${DEVTOOLS_PG_IDLE_IN_TX_TIMEOUT:-5min}
    volumes:
      - ./.vols/postgres:/var/lib/postgresql/data
      # Project-specific *.sh here are gitignored; only *.sample.sh is tracked.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEVTOOLS_PG_USER:-devtools} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      devops-network:
        ipv4_address: ${DEVTOOLS_PG_STATIC_IP:-172.19.0.100}

  # Shared MySQL. Root is bootstrap-only; app accounts admin + esa_dev come
  # from mysql-init/ensure-users.sh (idempotent, safe to re-run).
  devtools-mysql:
    image: mysql:8.4
    container_name: devtools-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DEVTOOLS_MYSQL_DB:-devtools}
      MYSQL_ROOT_PASSWORD: ${DEVTOOLS_MYSQL_ROOT_PASSWORD:?set DEVTOOLS_MYSQL_ROOT_PASSWORD in devtools/.env}
    volumes:
      - ./.vols/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DEVTOOLS_MYSQL_ROOT_PASSWORD:?set DEVTOOLS_MYSQL_ROOT_PASSWORD in devtools/.env}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      devops-network:
        ipv4_address: ${DEVTOOLS_MYSQL_STATIC_IP:-172.19.0.104}

  devtools-mysql-init:
    image: mysql:8.4
    container_name: devtools-mysql-init
    depends_on:
      devtools-mysql:
        condition: service_healthy
    restart: "no"
    environment:
      MYSQL_HOST: devtools-mysql
      MYSQL_DATABASE: ${DEVTOOLS_MYSQL_DB:-devtools}
      MYSQL_ROOT_PASSWORD: ${DEVTOOLS_MYSQL_ROOT_PASSWORD:?set DEVTOOLS_MYSQL_ROOT_PASSWORD in devtools/.env}
      DEVTOOLS_MYSQL_ADMIN_USER: ${DEVTOOLS_MYSQL_ADMIN_USER:-admin}
      DEVTOOLS_MYSQL_ADMIN_PASSWORD: ${DEVTOOLS_MYSQL_ADMIN_PASSWORD:?set DEVTOOLS_MYSQL_ADMIN_PASSWORD in devtools/.env}
      DEVTOOLS_MYSQL_ESA_USER: ${DEVTOOLS_MYSQL_ESA_USER:-esa_dev}
      DEVTOOLS_MYSQL_ESA_PASSWORD: ${DEVTOOLS_MYSQL_ESA_PASSWORD:?set DEVTOOLS_MYSQL_ESA_PASSWORD in devtools/.env}
      DEVTOOLS_MYSQL_ESA_DB: ${DEVTOOLS_MYSQL_ESA_DB:-esa_dev}
    volumes:
      - ./mysql-init/ensure-users.sh:/ensure-users.sh:ro
    entrypoint: ["/bin/sh", "/ensure-users.sh"]
    networks:
      - devops-network

  # Shared RabbitMQ broker. Env isolation is vhost (dev/stg), not separate
  # containers. Admin user comes from RABBITMQ_DEFAULT_* on first empty volume.
  # Vhosts are applied by the one-shot init service after the broker is healthy.
  devtools-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: devtools-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${DEVTOOLS_RMQ_USER:?set DEVTOOLS_RMQ_USER in devtools/.env}
      RABBITMQ_DEFAULT_PASS: ${DEVTOOLS_RMQ_PASSWORD:?set DEVTOOLS_RMQ_PASSWORD in devtools/.env}
    volumes:
      - ./.vols/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      devops-network:
        ipv4_address: ${DEVTOOLS_RMQ_STATIC_IP:-172.19.0.101}

  # One-shot: create vhosts + permissions (safe to re-run). Uses Management API
  # so it runs after RABBITMQ_DEFAULT_USER exists (unlike load_definitions).
  devtools-rabbitmq-init:
    image: curlimages/curl:8.11.1
    container_name: devtools-rabbitmq-init
    depends_on:
      devtools-rabbitmq:
        condition: service_healthy
    restart: "no"
    environment:
      RMQ_USER: ${DEVTOOLS_RMQ_USER:?set DEVTOOLS_RMQ_USER in devtools/.env}
      RMQ_PASS: ${DEVTOOLS_RMQ_PASSWORD:?set DEVTOOLS_RMQ_PASSWORD in devtools/.env}
      RMQ_HOST: devtools-rabbitmq
    volumes:
      - ./rabbitmq-init/ensure-vhosts.sh:/ensure-vhosts.sh:ro
    entrypoint: ["/bin/sh", "/ensure-vhosts.sh"]
    networks:
      - devops-network

  # Shared Loki — log store for all DSOaaS-deployed apps (and CFA apps that
  # already deploy via Auto DevOps). Push API is internal-only (compose DNS +
  # k8s bridge); developers browse via Grafana, not raw Loki.
  devtools-loki:
    image: grafana/loki:3.5.3
    container_name: devtools-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    user: "10001:10001"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./.vols/loki:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      devops-network:
        ipv4_address: ${DEVTOOLS_LOKI_STATIC_IP:-172.19.0.102}

  # Grafana Explore UI — oidc-auth-devtools@file (Keycloak groups admins + users).
  # Requires GRAFANA_DOMAIN in devtools/.env AND a Traefik network alias in
  # the main stack sample.env / docker-compose.yml (see maintainer docs).
  devtools-grafana:
    image: grafana/grafana:11.6.1
    container_name: devtools-grafana
    restart: unless-stopped
    depends_on:
      devtools-loki:
        condition: service_healthy
    environment:
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:?set GRAFANA_DOMAIN in devtools/.env}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:?set GRAFANA_DOMAIN in devtools/.env}
      GF_SECURITY_ADMIN_USER: ${DEVTOOLS_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${DEVTOOLS_GRAFANA_ADMIN_PASSWORD:?set DEVTOOLS_GRAFANA_ADMIN_PASSWORD in devtools/.env}
      # Trust oauth2-proxy ForwardAuth headers (X-Auth-Request-Email).
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Auth-Request-Email
      GF_AUTH_PROXY_HEADER_PROPERTY: email
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: Email:X-Auth-Request-Email Name:X-Auth-Request-User
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Editor
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: info
    volumes:
      - ./.vols/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.http.routers.devtools-grafana.rule: "Host(`${GRAFANA_DOMAIN:?set GRAFANA_DOMAIN in devtools/.env}`)"
      traefik.http.routers.devtools-grafana.entrypoints: "websecure"
      traefik.http.routers.devtools-grafana.tls.certresolver: "letsencrypt"
      traefik.http.routers.devtools-grafana.middlewares: "oidc-auth-devtools@file"
      traefik.http.services.devtools-grafana.loadbalancer.server.port: "3000"
    networks:
      - devops-network


  # Shared MinIO (S3). Root user is admin; cfa service user + buckets from
  # minio-init/ensure-users.sh. Console HTTPS via oidc-auth-devtools; S3 API
  # HTTPS without SSO (access-key auth) + TCP passthrough :29000.
  devtools-minio:
    image: quay.io/minio/minio:latest
    container_name: devtools-minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${DEVTOOLS_MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${DEVTOOLS_MINIO_ROOT_PASSWORD:?set DEVTOOLS_MINIO_ROOT_PASSWORD in devtools/.env}
      MINIO_SERVER_URL: https://${DEVTOOLS_MINIO_API_DOMAIN:?set DEVTOOLS_MINIO_API_DOMAIN in devtools/.env}
      MINIO_BROWSER_REDIRECT_URL: https://${DEVTOOLS_MINIO_CONSOLE_DOMAIN:?set DEVTOOLS_MINIO_CONSOLE_DOMAIN in devtools/.env}
    volumes:
      - ./.vols/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    labels:
      traefik.enable: "true"
      # S3 API — access-key auth only (do not put oauth2-proxy in front).
      traefik.http.routers.devtools-minio-api.rule: "Host(`${DEVTOOLS_MINIO_API_DOMAIN}`)"
      traefik.http.routers.devtools-minio-api.entrypoints: "websecure"
      traefik.http.routers.devtools-minio-api.tls.certresolver: "letsencrypt"
      traefik.http.routers.devtools-minio-api.service: "devtools-minio-api"
      traefik.http.services.devtools-minio-api.loadbalancer.server.port: "9000"
      # Console — platform SSO (admins+users) then MinIO login form.
      traefik.http.routers.devtools-minio-console.rule: "Host(`${DEVTOOLS_MINIO_CONSOLE_DOMAIN}`)"
      traefik.http.routers.devtools-minio-console.entrypoints: "websecure"
      traefik.http.routers.devtools-minio-console.tls.certresolver: "letsencrypt"
      traefik.http.routers.devtools-minio-console.middlewares: "oidc-auth-devtools@file"
      traefik.http.routers.devtools-minio-console.service: "devtools-minio-console"
      traefik.http.services.devtools-minio-console.loadbalancer.server.port: "9001"
    networks:
      devops-network:
        ipv4_address: ${DEVTOOLS_MINIO_STATIC_IP:-172.19.0.103}

  devtools-minio-init:
    image: quay.io/minio/mc:latest
    container_name: devtools-minio-init
    depends_on:
      devtools-minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${DEVTOOLS_MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${DEVTOOLS_MINIO_ROOT_PASSWORD:?set DEVTOOLS_MINIO_ROOT_PASSWORD in devtools/.env}
      DEVTOOLS_MINIO_CFA_USER: ${DEVTOOLS_MINIO_CFA_USER:-cfa}
      DEVTOOLS_MINIO_CFA_PASSWORD: ${DEVTOOLS_MINIO_CFA_PASSWORD:?set DEVTOOLS_MINIO_CFA_PASSWORD in devtools/.env}
      MINIO_ENDPOINT: http://devtools-minio:9000
    volumes:
      - ./minio-init/ensure-users.sh:/ensure-users.sh:ro
    entrypoint: ["/bin/sh", "/ensure-users.sh"]
    networks:
      - devops-network

  # Alloy — scrape Docker container logs (main platform compose + DevTools)
  # and push to Loki. k3d pod logs use the DaemonSet under devtools/k8s/.
  devtools-alloy:
    image: grafana/alloy:v1.9.2
    container_name: devtools-alloy
    restart: unless-stopped
    depends_on:
      devtools-loki:
        condition: service_healthy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./.vols/alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Alloy image has no wget/curl; process up + /-/ready is checked via host curl in verify.
    networks:
      - devops-network

  # Production n8n. One instance. Database is on devtools-postgres.
  # Editor login is the in-image Keycloak hook, not Traefik ForwardAuth,
  # so /webhook and /healthz stay public.
  devtools-n8n-db-init:
    image: postgres:16-alpine
    container_name: devtools-n8n-db-init
    depends_on:
      devtools-postgres:
        condition: service_healthy
    restart: "no"
    environment:
      PGHOST: devtools-postgres
      PGUSER: ${DEVTOOLS_PG_USER:?set DEVTOOLS_PG_USER in devtools/.env}
      PGPASSWORD: ${DEVTOOLS_PG_PASSWORD:?set DEVTOOLS_PG_PASSWORD in devtools/.env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in devtools/.env}
    volumes:
      - ./n8n/ensure-db.sh:/ensure-db.sh:ro
    entrypoint: ["/bin/sh", "/ensure-db.sh"]
    networks:
      - devops-network

  devtools-n8n:
    image: ${N8N_IMAGE:-registry.devops.yadatechnology.com/internal/n8n:latest-main}
    container_name: devtools-n8n
    restart: unless-stopped
    depends_on:
      devtools-n8n-db-init:
        condition: service_completed_successfully
      devtools-n8n-sandbox-api:
        condition: service_healthy
      devtools-n8n-searxng:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: devtools-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in devtools/.env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in devtools/.env}
      N8N_HOST: ${N8N_DOMAIN:?set N8N_DOMAIN in devtools/.env}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN:?set N8N_DOMAIN in devtools/.env}/
      N8N_WEBHOOK_URL: https://${N8N_DOMAIN:?set N8N_DOMAIN in devtools/.env}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      N8N_RUNNERS_ENABLED: "true"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      EXTERNAL_HOOK_FILES: /opt/n8n-oidc/hooks.js
      EXTERNAL_FRONTEND_HOOKS_URLS: /auth/oidc/frontend-hook.js
      N8N_ADDITIONAL_NON_UI_ROUTES: auth
      OIDC_ISSUER_URL: ${N8N_OIDC_ISSUER_URL:?set N8N_OIDC_ISSUER_URL in devtools/.env}
      OIDC_CLIENT_ID: n8n
      OIDC_CLIENT_SECRET: ${N8N_OIDC_CLIENT_SECRET:?set N8N_OIDC_CLIENT_SECRET in devtools/.env}
      OIDC_REDIRECT_URI: https://${N8N_DOMAIN:?set N8N_DOMAIN in devtools/.env}/auth/oidc/callback
      OIDC_SCOPES: openid email profile groups
      OIDC_ADMIN_GROUPS: admins
      OIDC_MEMBER_GROUPS: users
      N8N_INSTANCE_AI_MODEL: ${N8N_INSTANCE_AI_MODEL:-custom/nvidia/nemotron-3-nano-omni}
      N8N_INSTANCE_AI_MODEL_URL: ${N8N_INSTANCE_AI_MODEL_URL:-https://lm.apps.yadatechnology.com/v1}
      N8N_INSTANCE_AI_MODEL_API_KEY: ${N8N_INSTANCE_AI_MODEL_API_KEY:?set N8N_INSTANCE_AI_MODEL_API_KEY in devtools/.env}
      N8N_INSTANCE_AI_SANDBOX_ENABLED: "true"
      N8N_INSTANCE_AI_SANDBOX_PROVIDER: n8n-sandbox
      N8N_SANDBOX_SERVICE_URL: http://sandbox-api:8080
      N8N_SANDBOX_SERVICE_API_KEY: ${N8N_SANDBOX_SERVICE_API_KEY:?set N8N_SANDBOX_SERVICE_API_KEY in devtools/.env}
      N8N_INSTANCE_AI_SEARXNG_URL: http://devtools-n8n-searxng:8080
    volumes:
      - ./.vols/n8n:/home/node/.n8n
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    labels:
      traefik.enable: "true"
      traefik.http.routers.devtools-n8n.rule: "Host(`${N8N_DOMAIN:?set N8N_DOMAIN in devtools/.env}`)"
      traefik.http.routers.devtools-n8n.entrypoints: "websecure"
      traefik.http.routers.devtools-n8n.tls.certresolver: "letsencrypt"
      traefik.http.routers.devtools-n8n.priority: "100"
      traefik.http.services.devtools-n8n.loadbalancer.server.port: "5678"
    networks:
      devops-network:
        ipv4_address: ${N8N_STATIC_IP:-172.19.0.105}

  # Code sandbox for the n8n assistant. Internal only. The runner is privileged
  # Docker-in-Docker and must not be published. TLS names are sandbox-api and
  # sandbox-runner-1, so those aliases have to stay.
  devtools-n8n-sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-1.3.4}
    container_name: devtools-n8n-sandbox-certs
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: "1"
    volumes:
      - n8n-sandbox-tls:/tls
    networks:
      - devops-network

  devtools-n8n-sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-1.3.4}
    container_name: devtools-n8n-sandbox-api
    restart: unless-stopped
    depends_on:
      devtools-n8n-sandbox-certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: ${SANDBOX_API_KEYS:?set SANDBOX_API_KEYS in devtools/.env}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:?set SANDBOX_API_RUNNER_REGISTRATION_TOKEN in devtools/.env}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY:?set SANDBOX_API_RUNNER_API_KEY in devtools/.env}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - n8n-sandbox-tls:/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      devops-network:
        aliases:
          - sandbox-api

  devtools-n8n-sandbox-runner:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_VERSION:-1.3.4}
    container_name: devtools-n8n-sandbox-runner
    privileged: true
    restart: unless-stopped
    depends_on:
      devtools-n8n-sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION:-1.3.4}
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_RUNNER_REGISTRATION_TOKEN:?set SANDBOX_RUNNER_REGISTRATION_TOKEN in devtools/.env}
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_RUNNER_API_KEYS:?set SANDBOX_RUNNER_API_KEYS in devtools/.env}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - n8n-sandbox-tls:/tls:ro
    networks:
      devops-network:
        aliases:
          - sandbox-runner-1

  devtools-n8n-searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: devtools-n8n-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in devtools/.env}
    volumes:
      - ./n8n/searxng-settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - devops-network

volumes:
  n8n-sandbox-tls:
