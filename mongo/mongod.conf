# Runtime WiredTiger bounds. CLI --auth / --bind_ip_all still come from
# mongo/docker-entrypoint.sh. Do not set processManagement.fork.
storage:
  dbPath: /data/db
  syncPeriodSecs: 60
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1
      # archive=true: drop logs after checkpoint. log_size: checkpoint before
      # the journal can run away on a slow Windows bind mount.
      configString: log=(enabled=true,archive=true,compressor=snappy),checkpoint=(wait=60,log_size=256MB)

setParameter:
  diagnosticDataCollectionDirectorySizeMB: 200
