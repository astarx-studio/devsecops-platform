worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # -------------------------------------------------------------------------
  # oauth2-proxy-apps-hostfix
  # -------------------------------------------------------------------------
  # Sits between oauth2-proxy-apps and the k3d in-cluster Traefik NodePort.
  #
  # Traefik's oauth2-proxy-apps-upstream service uses passHostHeader: false so
  # that oauth2-proxy sees Host != X-Forwarded-Host and correctly builds a
  # full-URL OAuth "state" redirect (see oauth2-proxy #2552). That intentionally
  # corrupts the Host header oauth2-proxy would otherwise forward verbatim to
  # its own upstream (--pass-host-header defaults to true and simply relays
  # req.Host, oauth2-proxy has no option to substitute X-Forwarded-Host here).
  #
  # This hop repairs it: it restores Host (and X-Forwarded-Host) from
  # X-Forwarded-Host — which Traefik always sets from the original inbound
  # request regardless of passHostHeader — before proxying to the k3d
  # NodePort, so k3d's Host-based Ingress routing (e.g. *.dev.apps.<DOMAIN>)
  # matches correctly.
  server {
    listen 8080;

    location / {
      proxy_pass http://k3d-dsoaas-server-0:30080;
      proxy_http_version 1.1;

      proxy_set_header Host $http_x_forwarded_host;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
}
