# =============================================================================
# DSOaaS Auto DevOps Pipeline (branch deploys)
# =============================================================================
# Include this file from your app's .gitlab-ci.yml:
#
#   include:
#     - project: "configs/auto-devops-pipeline"
#       file: "/.gitlab-ci.yml"
#
# Tag-based deploys (semver tags instead of branch names): switch the file to
# "/.gitlab-ci.tags.yml". Job bodies live in ci/auto-devops-shared.yml.
#
# Deploy gates (exact branch name):
#   DEPLOY_DEV_REF   default develop   auto
#   DEPLOY_STG_REF   default staging   auto
#   DEPLOY_PROD_REF  default main      manual
# Set a ref to "none" to disable that target. Anything else is build/test only.
# =============================================================================

include:
  - local: ci/auto-devops-shared.yml

# Suppress pipelines when this config repo is pushed directly.
workflow:
  rules:
    - if: '$CI_PROJECT_PATH == "system/devsecops-platform/configs/auto-devops-pipeline"'
      when: never
    - when: always

# Branch pipelines only. Tag pushes do not run these jobs.
prepare-build-env:
  rules:
    - if: '$CI_COMMIT_BRANCH'

.build-kaniko:
  rules:
    - if: '$CI_COMMIT_BRANCH'

build:
  rules:
    - if: '$CI_COMMIT_BRANCH'

test:
  rules:
    - if: '$CI_COMMIT_BRANCH'

.sonar-scan:
  rules:
    - if: '$CI_COMMIT_BRANCH'

sonar:scan:
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy:dev:
  extends: .deploy-helm
  variables:
    DEPLOY_ENV: dev
  environment:
    name: dev
    url: https://$APP_HOST
  rules:
    - if: '$DEPLOY_DEV_REF == "none"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_DEV_REF'
      when: on_success

deploy:stg:
  extends: .deploy-helm
  variables:
    DEPLOY_ENV: stg
  environment:
    name: stg
    url: https://$APP_HOST
  rules:
    - if: '$DEPLOY_STG_REF == "none"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_STG_REF'
      when: on_success

deploy:prod:
  extends: .deploy-helm
  variables:
    DEPLOY_ENV: prod
  environment:
    name: prod
    url: https://$APP_HOST
  rules:
    - if: '$DEPLOY_PROD_REF == "none"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_PROD_REF'
      when: manual
      allow_failure: false
